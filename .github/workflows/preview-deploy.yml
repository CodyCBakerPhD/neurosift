name: Preview Deploy (GitHub Pages)

# Builds the app and publishes it to GitHub Pages so changes can be previewed
# on a fork without Cloudflare credentials. Enable Pages for the repository
# with "Source: GitHub Actions" (Settings -> Pages) for this to work.
# The site is served at https://<owner>.github.io/<repo>/.

on:
  push:
    branches:
      - main-v2
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer pushes cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # Build with the base path set to the Pages sub-path so assets and the
      # client-side router resolve correctly under /<repo>/.
      - name: Build project
        run: |
          ./devel/generate_build_info.sh
          npx tsc -b
          npx vite build --base="${{ steps.pages.outputs.base_path }}/"

      # GitHub Pages has no server-side SPA fallback, so route deep-links
      # through index.html by serving the same document as 404.html.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
