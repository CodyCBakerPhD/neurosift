name: Preview Deploy (GitHub Pages)

# Deploys a per-PR preview of the app to GitHub Pages using pr-preview-action,
# which publishes the build into pr-preview/pr-<N>/ on the gh-pages branch,
# posts the preview URL as a PR comment, and removes it when the PR closes.
#
# One-time setup: Settings -> Pages -> Source: "Deploy from a branch",
# Branch: "gh-pages" / "(root)". Each PR preview is then served at
# https://<owner>.github.io/<repo>/pr-preview/pr-<N>/.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency: preview-${{ github.ref }}

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Update submodules
        if: github.event.action != 'closed'
        run: git submodule update --init --recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      # Build with the base path pointing at the PR preview sub-directory so
      # assets and the client-side router resolve under
      # /<repo>/pr-preview/pr-<N>/.
      - name: Build project
        if: github.event.action != 'closed'
        run: |
          ./devel/generate_build_info.sh
          npx tsc -b
          npx vite build \
            --base="/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/"

      # GitHub Pages has no server-side SPA fallback, so route deep-links
      # through index.html by serving the same document as 404.html.
      - name: Add SPA fallback
        if: github.event.action != 'closed'
        run: cp dist/index.html dist/404.html

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
