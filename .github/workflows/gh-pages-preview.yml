name: GitHub Pages Preview

# Fork-only frontend preview on GitHub Pages, as a stand-in for the
# Cloudflare Pages deploy that only upstream can run (it needs
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID, which a fork doesn't have).
#
# What this gives you: the real frontend bundle, served from
# https://<owner>.github.io/<repo>/, talking to the same already-deployed
# public APIs the production site talks to (they are hardcoded in src/ -
# the build reads no VITE_* variables). Good enough to review a frontend
# change end to end.
#
# What it does NOT give you: anything needing a per-origin credential.
# DANDI/EMBER API keys live in localStorage, which is per-origin, so keys
# entered on neurosift.app do not exist here - the preview is anonymous
# browsing of public data. Any API that gates on Origin may also refuse
# this one. See docs/github-pages-preview.md.
#
# Setup is documented in docs/github-pages-preview.md and involves repo
# settings that no workflow token can change. Read it before the first run.

on:
  push:
    # The preview branch, NOT the upstream-tracking branch. main-v2 is kept
    # identical to upstream so "Sync fork" keeps working, which means it
    # does not carry this file and a trigger on it could never fire.
    branches: [main-v2-preview]
  workflow_dispatch:

# Never run upstream, even if this file somehow lands in an upstream PR.
# Guarded at the job level (a workflow-level `if` is not supported).
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer commit supersede an in-flight one.
concurrency:
  group: gh-pages-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.repository != 'flatironinstitute/neurosift'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # The nifti viewer vendors niivue as a submodule; the build fails
      # without it. fetch-depth is deliberately left at the default: nothing
      # in the build reads git history (devel/generate_build_info.sh takes
      # the version from package.json and the timestamp from node).
      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Matches pr-checks.yml: vitest 4 needs Node 20+, jsdom 30 needs
          # 22.22+.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `enablement: true` is deliberately NOT set here - see
      # docs/github-pages-preview.md. The workflow token can deploy to an
      # existing Pages site but cannot create one, and asking it to fails
      # the run with "Resource not accessible by integration". Enabling
      # Pages is a manual, one-time repo setting.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # A project site is served from /<repo>/, not from the domain root
      # Cloudflare Pages gives production. NEUROSIFT_BASE_PATH sets the
      # bundler's base (and, through import.meta.env.BASE_URL, the router's
      # basename). Unset, it defaults to "/" and production is unchanged.
      - name: Build project
        env:
          NEUROSIFT_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # GitHub Pages has no rewrite engine, so public/_redirects
      # (/* -> /index.html 200) does nothing here. Pages' only fallback is
      # the site's 404.html, so index.html is copied to it: a deep link
      # then serves the app shell and React Router resolves the route
      # client-side. The response status is 404 rather than 200 - the app
      # renders correctly regardless.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
